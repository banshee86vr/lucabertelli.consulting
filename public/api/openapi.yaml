openapi: 3.0.3
info:
  title: lucabertelli.consulting discovery
  version: "1.8.0"
  description: |
    This site does not issue credentials. The documents below are public and unauthenticated. GET, HEAD, and POST /api are the x402 challenge and do not store the body.
    Agent registration is anonymous: /auth.md and the two OAuth discovery documents describe it, and POST to the registration URLs changes nothing.
    The A2A Agent Card is at /.well-known/agent-card.json. POST /a2a/v1 accepts JSON-RPC SendMessage and returns a public message. It does not create a task or store the request. capabilities.extensions lists the AP2 merchant role at the v0.1 specification URI and the v0.1.0 URI. required is false. This card does not take card payment.
    The Agent Skills index is at /.well-known/agent-skills/index.json.
    The MCP server card is at /.well-known/mcp/server-card.json. POST /mcp is Streamable HTTP. The tool read_practice returns the public index. Resources, prompts, and sessions are off.
    ACP discovery is at /.well-known/acp.json. POST /acp/checkout_sessions does not create a session, does not take payment, and does not store the body.
    UCP discovery is at /.well-known/ucp. protocol_version is 2026-08-25. POST /ucp/v1/checkout-sessions does not create a session, does not take payment, and does not store the body. ucp.payment_handlers is empty.
    Machine Payment Protocol discovery is GET /openapi.json. POST /api/engagement returns 402, does not settle a charge, and does not store the body. x-payment-info.amount is null because the price is a written proposal.
    x402 is GET, HEAD, and POST /api. An unpaid call returns 402 with a PAYMENT-REQUIRED header. The scheme is exact, the network is eip155:84532 (Base Sepolia), and the price is $0.001 USDC. payTo is 0x2C2E3d99BeD343A0499c5b68CeedeFaE64DE6510. The facilitator is https://x402.org/facilitator. A settled call returns a JSON acknowledgement and does not store the body.
    The Web Bot Auth directory is at /.well-known/http-message-signatures-directory.
servers:
  - url: https://lucabertelli.consulting
paths:
  /llms.txt:
    get:
      operationId: getAgentIndex
      summary: Agent index
      description: Identity, page list, and the FAQ questions from each service page.
      responses:
        "200":
          description: Plain-text index.
          content:
            text/plain:
              schema:
                type: string
  /llms-full.txt:
    get:
      operationId: getAgentFullText
      summary: Full text for agents
      description: Full text of services (with FAQ), insights, and articles.
      responses:
        "200":
          description: Plain-text corpus.
          content:
            text/plain:
              schema:
                type: string
  /en/rss.xml:
    get:
      operationId: getEnglishFeed
      summary: English feed
      description: Blog articles and insights written in English.
      responses:
        "200":
          description: RSS 2.0 document.
          content:
            application/xml:
              schema:
                type: string
  /it/rss.xml:
    get:
      operationId: getItalianFeed
      summary: Italian feed
      description: Blog articles and insights written in Italian.
      responses:
        "200":
          description: RSS 2.0 document.
          content:
            application/xml:
              schema:
                type: string
  /sitemap-index.xml:
    get:
      operationId: getSitemapIndex
      summary: Sitemap index
      responses:
        "200":
          description: Sitemap index pointing at the URL set.
          content:
            application/xml:
              schema:
                type: string
  /.well-known/security.txt:
    get:
      operationId: getSecurityContact
      summary: Security contact
      description: RFC 9116 contact for vulnerability reports.
      responses:
        "200":
          description: security.txt document.
          content:
            text/plain:
              schema:
                type: string
  /.well-known/api-catalog:
    get:
      operationId: getApiCatalog
      summary: API catalog
      description: RFC 9727 linkset describing this discovery API.
      responses:
        "200":
          description: Linkset document.
          content:
            application/linkset+json:
              schema:
                type: object
                required: [linkset]
                properties:
                  linkset:
                    type: array
                    items:
                      type: object
  /api:
    get:
      operationId: getX402Challenge
      summary: x402 payment challenge
      description: Returns 402 with a PAYMENT-REQUIRED header until an exact USDC payment on Base Sepolia (eip155:84532) settles through https://x402.org/facilitator. The price is $0.001. payTo is 0x2C2E3d99BeD343A0499c5b68CeedeFaE64DE6510. The body is not stored. A settled call returns a JSON acknowledgement. Consulting work is still priced in a written proposal.
      responses:
        "402":
          description: Payment required. Terms are in the PAYMENT-REQUIRED header.
        "200":
          description: Settled acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [service, resource, contact, message]
    post:
      operationId: postX402Challenge
      summary: x402 payment challenge
      description: Same challenge as GET /api. The body is discarded and is not stored.
      responses:
        "402":
          description: Payment required. Terms are in the PAYMENT-REQUIRED header.
        "200":
          description: Settled acknowledgement.
    head:
      operationId: headX402Challenge
      summary: x402 payment challenge
      description: Same challenge as GET /api, with no response body.
      responses:
        "402":
          description: Payment required. Terms are in the PAYMENT-REQUIRED header.
  /api/status.json:
    get:
      operationId: getStatus
      summary: Static health document
      description: |
        Returns ok while the site is serving this file. It does not probe
        anything beyond the origin that returned it.
      responses:
        "200":
          description: Health document.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /auth.md:
    get:
      operationId: getAuthMd
      summary: Agent registration instructions
      description: |
        Public Markdown. The H1 contains auth.md. Anonymous clients need
        no credential. The document links the OAuth discovery metadata.
      responses:
        "200":
          description: Markdown document.
          content:
            text/markdown:
              schema:
                type: string
  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      summary: OAuth protected resource metadata
      description: |
        RFC 9728 document. authorization_servers lists Cloudflare Access
        (https://lucabertelli.cloudflareaccess.com) and this origin.
        A path on the resource identifier is served under this well-known
        prefix. The English homepage identifier
        https://lucabertelli.consulting/en/ is published at
        /.well-known/oauth-protected-resource/en/ with that resource value.
        The scope read names public access anonymous clients already have.
        bearer_methods_supported lists header. This origin does not mint
        bearer tokens. A 401 carries WWW-Authenticate resource_metadata.
      responses:
        "200":
          description: Protected resource metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - resource
                  - authorization_servers
                  - scopes_supported
                  - bearer_methods_supported
  /.well-known/oauth-authorization-server:
    get:
      operationId: getAuthorizationServerMetadata
      summary: OAuth authorization server metadata
      description: |
        RFC 8414 document. issuer is https://lucabertelli.consulting, which
        is listed in authorization_servers on the protected resource
        metadata. Cloudflare Access is the first authorization server.
        agent_auth describes anonymous access. grant_types_supported
        is empty: this origin has no token endpoint.
      responses:
        "200":
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, agent_auth]
  /.well-known/agent-card.json:
    get:
      operationId: getA2aAgentCard
      summary: A2A Agent Card
      description: |
        A2A 1.0 Agent Card. name, description, version, supportedInterfaces,
        capabilities, and skills. The preferred interface is JSON-RPC 1.0
        at /a2a/v1. Streaming, push notifications, and the extended card
        are false. capabilities.extensions lists the AP2 merchant role.
        required is false. This card does not take card payment.
      responses:
        "200":
          description: Agent Card JSON.
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - description
                  - version
                  - supportedInterfaces
                  - capabilities
                  - skills
  /.well-known/mcp/server-card.json:
    get:
      operationId: getMcpServerCard
      summary: MCP Server Card
      description: SEP-1649 server card. serverInfo has name and version. transport.endpoint is the Streamable HTTP URL /mcp. capabilities lists tools, resources, and prompts.
      responses:
        "200":
          description: MCP server card JSON.
          content:
            application/json:
              schema:
                type: object
                required: [serverInfo, transport, capabilities]
                properties:
                  serverInfo:
                    type: object
                    required: [name, version]
                  transport:
                    type: object
                    required: [type, endpoint]
                  capabilities:
                    type: object
                    required: [tools, resources, prompts]
  /.well-known/acp.json:
    get:
      operationId: getAcpDiscovery
      summary: ACP discovery document
      description: |
        Agentic Commerce Protocol discovery. protocol.name is acp.
        protocol.version is 2026-04-17. api_base_url is
        https://lucabertelli.consulting/acp. transports lists rest.
        capabilities.services lists checkout. No authentication.
      responses:
        "200":
          description: Discovery JSON.
          content:
            application/json:
              schema:
                type: object
                required:
                  - protocol
                  - api_base_url
                  - transports
                  - capabilities
  /.well-known/ucp:
    get:
      operationId: getUcpProfile
      summary: UCP business profile
      description: |
        Universal Commerce Protocol profile. protocol_version is 2026-08-25.
        services lists dev.ucp.shopping over REST at
        https://lucabertelli.consulting/ucp/v1. capabilities lists
        dev.ucp.shopping.checkout. endpoints.rest is that base.
        ucp.payment_handlers is empty. No authentication.
      responses:
        "200":
          description: UCP profile JSON.
          content:
            application/json:
              schema:
                type: object
                required:
                  - protocol_version
                  - services
                  - capabilities
                  - endpoints
                  - ucp
  /.well-known/http-message-signatures-directory:
    get:
      operationId: getWebBotAuthDirectory
      summary: Web Bot Auth key directory
      description: JSON Web Key Set for the Ed25519 key this origin uses to sign outbound agent requests. Verifiers check Signature-Agent and Signature-Input against this directory.
      responses:
        "200":
          description: HTTP message signatures directory.
          content:
            application/http-message-signatures-directory+json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    minItems: 1
  /mcp:
    post:
      operationId: postMcp
      summary: MCP Streamable HTTP
      description: JSON-RPC for the public read_practice tool. Protocol 2026-07-28 uses server/discover. Earlier Streamable HTTP versions use initialize. There is no session, no resource list, and no prompt list. The body is not stored. GET and DELETE are 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                method:
                  type: string
      responses:
        "200":
          description: JSON-RPC result or error.
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Accepted notification. No body.
        "400":
          description: Unsupported protocol version or header mismatch.
        "404":
          description: Unknown method on protocol 2026-07-28.
        "406":
          description: Accept does not list application/json and text/event-stream.
        "413":
          description: Request body is larger than 64 KiB.
        "415":
          description: Content-Type is not application/json.
  /acp/checkout_sessions:
    post:
      operationId: postAcpCheckoutSession
      summary: Refuse an ACP checkout session
      description: |
        Accepts an ACP create-checkout POST and does not create a session.
        There is no catalog and no payment handler. The body is discarded
        and is not stored. API-Version 2026-04-17 and Idempotency-Key are
        required. Orders, carts, and delegate_payment are not offered.
      responses:
        "400":
          description: No session is created, or a required header is missing.
          content:
            application/json:
              schema:
                type: object
                required: [type, code, message]
        "403":
          description: Origin is local, private, or not https.
        "413":
          description: Request body is larger than 64 KiB.
        "415":
          description: Content-Type is not application/json.
  /ucp/v1/checkout-sessions:
    post:
      operationId: postUcpCheckoutSession
      summary: Refuse a UCP checkout session
      description: |
        Accepts a UCP create-checkout POST and does not create a session.
        payment_handlers is empty. There is no catalog. The body is discarded
        and is not stored. Do not send payment credentials.
      responses:
        "400":
          description: No session is created.
          content:
            application/json:
              schema:
                type: object
                required: [ucp, messages, continue_url]
        "403":
          description: Origin is local, private, or not https.
        "413":
          description: Request body is larger than 64 KiB.
        "415":
          description: Content-Type is not application/json.
  /.well-known/agent-skills/index.json:
    get:
      operationId: getAgentSkillsIndex
      summary: Agent Skills discovery index
      description: |
        Agent Skills Discovery index. $schema is
        https://schemas.agentskills.io/discovery/0.2.0/schema.json.
        skills lists name, type, description, url, and digest.
        digest is sha256 of the artifact bytes.
      responses:
        "200":
          description: Skills index JSON.
          content:
            application/json:
              schema:
                type: object
                required:
                  - "$schema"
                  - skills
  /.well-known/agent-skills/consulting-practice/SKILL.md:
    get:
      operationId: getConsultingPracticeSkill
      summary: Consulting practice skill
      description: |
        SKILL.md for consulting-practice. YAML frontmatter name and
        description match the index entry. Served as text/markdown.
      responses:
        "200":
          description: Skill instructions.
          content:
            text/markdown:
              schema:
                type: string
  /a2a/v1:
    post:
      operationId: postA2aSendMessage
      summary: A2A JSON-RPC
      description: |
        JSON-RPC 2.0. SendMessage returns a direct message that points at
        the public documents. The body is not stored. GetTask, streaming,
        push notification configuration, and GetExtendedAgentCard return
        an A2A error. There is no task store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: string
                method:
                  type: string
      responses:
        "200":
          description: JSON-RPC result or error.
          content:
            application/json:
              schema:
                type: object
        "413":
          description: Request body is larger than 64 KiB.
        "415":
          description: Content-Type is not application/json.
  /agent/auth/register:
    get:
      operationId: getAgentRegistration
      summary: Anonymous registration description
      description: |
        JSON description of anonymous access. No account is created and
        no credential is issued.
      responses:
        "200":
          description: Registration description.
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: postAgentRegistration
      summary: Anonymous registration description
      description: |
        Same document as GET. The body is ignored. No account is created,
        no email is sent, and no credential is issued.
      responses:
        "200":
          description: Registration description.
          content:
            application/json:
              schema:
                type: object
  /agent/auth/claim:
    get:
      operationId: getAgentClaim
      summary: Claim description
      description: There is no account to claim.
      responses:
        "200":
          description: Claim description.
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: postAgentClaim
      summary: Claim description
      description: |
        Same document as GET. Does not start a confirmation ceremony and
        does not send email.
      responses:
        "200":
          description: Claim description.
          content:
            application/json:
              schema:
                type: object
  /agent/auth/revoke:
    get:
      operationId: getAgentRevocation
      summary: Revocation description
      description: This origin stores no agent credential to revoke.
      responses:
        "200":
          description: Revocation description.
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: postAgentRevocation
      summary: Revocation description
      description: |
        Same document as GET. Nothing is deleted by this call. Email the
        practice to ask for deletion of correspondence.
      responses:
        "200":
          description: Revocation description.
          content:
            application/json:
              schema:
                type: object

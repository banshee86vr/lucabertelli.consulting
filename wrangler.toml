name = "lucabertelli-consulting"
compatibility_date = "2024-09-23"
main = "src/worker.ts"

[[kv_namespaces]]
binding = "lb_consulting"
id = "01ee33bd3673427c975a9804434376d6"

[[kv_namespaces]]
binding = "SESSION"
id = "1b5008e8ee4249bf87131391a7045703"

# HTML routes run the Worker first so Accept: text/markdown can be negotiated.
# Auth.md discovery runs first too, so GET and POST share one response and a
# POST cannot be swallowed by the static asset.
# Path-suffixed protected resource metadata (RFC 9728) is generated by the
# Worker. The apex redirects to /en/, so clients request the /en/ suffix.
# The A2A card is also a static file. run_worker_first keeps that path and
# /a2a/v1 on the Worker, including POST.
# The Agent Skills index and SKILL.md are static files too. run_worker_first
# keeps GET and HEAD on the Worker so the content type is text/markdown or
# application/json.
# The MCP server card is a static file. run_worker_first keeps that path and
# /mcp on the Worker, including POST. The card must not answer the transport.
# The Web Bot Auth directory is also a static JWKS. run_worker_first keeps
# the path on the Worker so a matching private key can sign the response.
# The ACP discovery document is a static file. run_worker_first keeps that
# path and /acp on the Worker, including POST. The document must not answer
# checkout, and checkout must not store the body.
# The UCP profile is a static file. run_worker_first keeps /.well-known/ucp
# and /ucp/v1 on the Worker, including POST. Checkout must not store the body.
# The MPP OpenAPI document is a static file. run_worker_first keeps
# /openapi.json and /api/engagement on the Worker, including POST. The
# engagement route must not store the body.
# Other static files stay on the asset path.
[assets]
binding = "ASSETS"
run_worker_first = [
  "/",
  "/en",
  "/en/*",
  "/it",
  "/it/*",
  "/auth.md",
  "/.well-known/oauth-protected-resource",
  "/.well-known/oauth-protected-resource/*",
  "/.well-known/oauth-authorization-server",
  "/.well-known/agent-card.json",
  "/.well-known/agent-skills/index.json",
  "/.well-known/agent-skills/consulting-practice/SKILL.md",
  "/.well-known/mcp/server-card.json",
  "/.well-known/http-message-signatures-directory",
  "/.well-known/acp.json",
  "/.well-known/ucp",
  "/openapi.json",
  "/api/engagement",
  "/mcp",
  "/acp",
  "/acp/*",
  "/ucp/v1",
  "/ucp/v1/*",
  "/a2a/v1",
  "/agent/auth",
  "/agent/auth/*",
]

[env.preview]
name = "lucabertelli-consulting-preview"
